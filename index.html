<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Кликер Монеты</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <div class="game-container">
        <h1>🪙 Кликер</h1>
        
        <div class="top-panel">
            <div class="score-board">
                <span id="coins">0</span>
            </div>
            <button id="shopBtn" class="icon-btn"><i class="fas fa-store"></i></button>
        </div>

        <!-- Зона клика: теперь это большая монета -->
        <div class="click-zone">
            <div id="coinBtn" class="coin-button">
                <i class="fas fa-coins"></i>
            </div>
            <div id="message" class="message"></div>
        </div>

        <!-- Инфо о пассивном доходе -->
        <div class="auto-info">
            <i class="fas fa-bolt"></i> <span id="autoIncome">0</span>/сек
        </div>

        <!-- Магазин -->
        <div id="shopModal" class="modal">
            <div class="modal-content">
                <span id="closeShop" class="close-btn">&times;</span>
                <h2><i class="fas fa-store"></i> Магазин</h2>
                <div class="upgrades-list" id="upgradesList"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
